guides: {"title":"&aДовідник OneBlock","topic":{"start":"Перший острів","core":"Ядро та етапи","skills":"Особисті навички","workshop":"Майстерня","charge":"Заряд і пакети ресурсів","merchant":"Скупник","bazaar":"Базар","auction":"Аукціон і обмін","claims":"Де забрати нагороди","profiles-coop":"Профілі та кооп","survival":"Як не застрягти","hub":"Хаб і NPC"},"body":{"start":"&6Твій перший острів\n&f1. &7Натисни зірку меню → «Профілі».\n&f2. &7Обери вільний слот — з'явиться острів.\n&f3. &7Ламай центральний блок — він відновлюється.\n&f4. &7Посади паросток і вирости дерево.\n\n&eДалі: &7меню → «Наступна ціль».\n&eДодому: &f/home","core":"&6Ядро — серце острова\n&7Центральний блок завжди відновлюється.\n&7Ламай його, щоб отримувати ресурси.\n\n&fДля нового етапу потрібні:\n&8• &7зламані блоки ядра\n&8• &7вирощені колоди\n&8• &7рівень навички, ресурси й монети\n&7Наступні картки — точні вимоги.\n\n&eУ коопі ядро, монети, заряд\n&eі покращення спільні.","skills":"&6Навички\n&7Гірництво, лісництво й фермерство\n&7окремі для кожного профілю.\n\n&fДосвід (XP) дають:\n&8• &7руди з ядра (правильним інструментом)\n&8• &7дерева, які ти виростив\n&8• &7дозрілі культури\n\n&cXP не дають: &7куплені, підібрані\n&7й повторно поставлені блоки.\n&7Шовковий дотик може не зарахувати злам.","workshop":"&6Майстерня\n&f1. &7Обери рецепт.\n&f2. &7Перевір матеріали, монети й рівень.\n&f3. &7Підтверди — предмет буде в «Нагородах».\n\n&7Попередній інструмент потрібен не завжди.\n&7Броню створюють у «Бойовому спорядженні».","charge":"&6Заряд ядра\n&7Кожен злам ядра додає спільний заряд.\n&7За заряд замовляють пакети ресурсів.\n\n&f1. &7Обери спеціалізацію.\n&f2. &7Замов пакет — він прийде в «Нагороди».\n\n&7Мінеральний пакет стає кращим\n&7з новими етапами ядра.","merchant":"&6Скупник\n&7Стоїть у хабі (&f/hub&7).\n&7Купує звичайні ресурси за монети.\n\n&f1. &7Поклади ресурси в кошик.\n&f2. &7Перевір суму й підтверди.\n\n&7Особливі інструменти й спорядження\n&7не продаються.\n&eПомилився? &7Продане можна викупити\n&7за ту саму ціну протягом обмеженого часу.","bazaar":"&6Базар\n&7Гравці торгують ресурсами між собою.\n\n&fЗаявка на купівлю &7— монети резервуються.\n&fЗаявка на продаж &7— ресурси резервуються.\n&7Угода відбувається, коли є зустрічна заявка.\n&7Немає заявок — миттєво купити не вийде.\n\n&7Скасування повертає залишок в отримання.\n&eПеревір кількість, ціну, суму й комісію.","auction":"&6Аукціон\n&fКупити зараз &7— фіксована ціна.\n&fСтавки &7— виграє найвища ставка.\n&7Перевір предмет, ціну, комісію й строк.\n\n&6Обмін із гравцем\n&f/trade <нік> &7— гравець має бути поруч.\n&7Зміна пропозиції скидає готовність.\n&7Обмін відбудеться, коли обидва підтвердять.","claims":"&6Де забрати нагороди\n&fМеню → «Нагороди»: &7крафт, пакети, данжі.\n&fБазар і аукціон: &7у їхніх NPC у хабі.\n\n&7Немає місця? Звільни інвентар і спробуй ще.\n&7Видача затрималась? Зачекай хвилину —\n&7нічого не загубиться.","profiles-coop":"&6Профілі\n&7Кожен профіль — окремий острів, монети,\n&7ядро, інвентар і навички.\n\n&6Кооператив\n&f/ob coop invite <нік> &7— запросити\n&f/ob coop accept &7— прийняти\n&7Стартовий набір видається лише раз.\n&cУважно читай підтвердження перед\n&cвиходом або видаленням профілю.","survival":"&6Як не застрягти\n&7Зберігай паростки й насіння.\n&7Вирощуй дерева й культури.\n\n&7Воду, лаву й фермерський набір\n&7можна створити в Майстерні.\n&7Перевір пакети природи та «Нагороди».\n\n&cНе видаляй профіль через загублений\n&cпредмет — напиши адміністратору.","hub":"&6Хаб — поселення над хмарами\n&f/hub &7— перейти в хаб.\n\n&fСкупник &7— продаж ресурсів за монети.\n&fБазар &7— заявки гравців.\n&fАукціон &7— окремі лоти.\n&fПровідник данжів &7— арени для 1–4 гравців.\n\n&f/home &7— повернутися на острів.","hub-generation":"&6Хаб\n&7Дороги ведуть до скупника, базару,\n&7аукціону, майстерні й провідників.\n&7Данж: натисни NPC «Провідник данжів».\n&7Таблички на брамах — лише декор.\n\n&f/menu &7— усі розділи · &f/home &7— на острів","hub-workshop":"&6Майстерня в хабі\n&7Місце зустрічі та довідки.\n&7Рецепти: зірка меню → «Майстерня».\n&7Столи тут декоративні — нічого не видають.","combat-skills":"&6Бойовий стиль\n&7Стиль залежить від зброї в руці:\n&8• &7мечі й сокири — ближній бій\n&8• &7луки й арбалети — дальній бій\n&8• &7жезли — магія\n&7Клас обирати не треба, змінюй будь-коли.\n\n&fЖезл: &7ПКМ. Мана відновлюється сама.","combat-workshop":"&6Бойове спорядження\n&7Меню → «Бойове спорядження» або &f/combat&7.\n&7Тут створюються зброя, броня й компоненти.\n&712 фрагментів і 1000 монет дають зачарований,\n&7а фінальна броня й зброя ще потребують\n&7загартованих ядер, монет і етапу «Розвинене ядро».\n&7Платна скриня арени може дати спорядження.\n\n&7Арени для 1–4 гравців — у провідника\n&7данжів у хабі.","combat-claims":"&6Нагороди та скрині\n&7Звичайні нагороди й скрині — окремо.\n\n&fСкриня: &7переглянь вміст і ціну →\n&7підтверди → оплати.\n&7Неоплачена скриня чекає 48 годин.\n&7Оплачене не зникає.\n\n&f«Забрати все» &7бере звичайні нагороди,\n&7скільки вміститься. Скрині не відкриває.","mine-hub":"&6Як почати\n&f1. &7У хабі натисни «Провідник данжів».\n&f2. &7Обери {mine_name} і збери групу.\n\n&f/dungeon invite <нік> &7— запросити\n&f/dungeon accept <лідер> &7— прийняти\n&f/dungeon ready &7— я готовий\n&f/dungeon start &7— старт (лише лідер)\n\n&7Усі 1–4 гравці мають стояти біля входу.\n&7Рекомендовано: алмазне спорядження.","mine-survival":"&6Правила арени\n&7Хвилі 1–4 — бій, хвиля 5 — бос.\n&7Далі хвилі тривають без кінця.\n&7Після боса: &f/dungeon continue &7або &ffinish&7.\n\n&7Спільні спроби: &f{mine_attempts}\n&c/hub або /home під час бою = смерть.\n&7Вилетів? Повернись протягом {mine_reconnect} с.\n&7Загиблий спостерігає до кінця хвилі.\n&7Перезапуск сервера перериває похід.","mine-claims":"&6Нагороди арен\n&7У кінці походу чекають дві скрині:\n&fБезкоштовна &7— фрагменти, більше за кожного боса.\n&fПлатна &7— ще фрагменти й рідкісний шанс\n&7на зачарований фрагмент чи спорядження.\n&7Вміст і ціну видно до оплати.\n&7Неоплачена скриня чекає 48 годин.\n&f«Забрати все» &7не відкриває скринь."},"back":"Назад","close":"Закрити","previous":"Попередня сторінка","next":"Наступна сторінка","link":"&aПерейти до розділу","choose":"","state":"Поточний стан","readonly":"&eДовідку можна читати, але дії зараз недоступні.","no_profile":"Створи профіль у меню «Профілі».","unknown":"Невідома тема.","intro":"&aЗірка в 9-му слоті — меню","coins":"Монети: {value}","charge":"Заряд: {value}","coin_label":"монет","break_label":"зламів","log_label":"колод","level_label":"рівень","location":"Відвідай хаб: {value}"}


