guides: {"title":"&aOneBlock guide","topic":{"start":"First island","core":"Core and chapters","skills":"Personal skills","workshop":"Workshop","charge":"Charge and packs","merchant":"Merchant","bazaar":"Bazaar","auction":"Auctions and trades","claims":"Claims","profiles-coop":"Profiles and co-op","survival":"Renewable resources","hub":"Hub and visits"},"body":{"start":"&6Your first island\n&f1. Menu star → Profiles → an empty slot.\n&f2. Break the central block and collect resources.\n&f3. Plant a sapling on dirt and grow a tree.\n&7Next: Menu → Goals and achievements.\n&7Return to your island with /home.","core":"Break the central block with a suitable tool. Chapters require \neligible breaks, grown logs, resources and coins. The next \ncards show current configured requirements. Chapter, wallet, \ncharge and upgrades are shared by co-op members.","skills":"Mining, Forestry and Farming XP belongs to each player in each \nprofile. Harvest eligible ores, grown trees and mature crops. \nBuying, picking up or replacing resources does not grant \nharvesting XP. Silk Touch and unsuitable tools may prevent \neligible resource credit.","workshop":"Choose a recipe, check its exact materials, coins and personal skill, then confirm. Not every recipe consumes the previous custom tool. Results stay in personal Rewards. New custom armor comes separately from combat-room chests.","charge":"Eligible core breaks charge the shared core. Choose a focus \nand redeem a configured pack. Packs go to claims. Advanced \nmineral packs depend on your current chapter. These cards show \ncurrent pack costs and contents.","merchant":"Visit the merchant in the hub. Review the basket before \nselling plain resources. Custom tools and special items are \nexcluded. Buyback is time limited: check the current offer and \nexpiry in the merchant interface.","bazaar":"Bazaar matches offers from other players. Empty order books \ncannot fill instant trades. Buy orders reserve coins; sell \noffers reserve resources. Cancelling returns the unfilled \nbalance to claims. Review amount, unit price, total and fee.","auction":"Auctions support BIN and bids for permitted items. Review the \nitem, total price, fee and duration. /trade <player> exchanges \nwith a nearby player; changing an offer resets readiness. Both \nplayers confirm the final offer.","claims":"&6Collect what you earned\n&fMenu → Rewards: crafting, packs and the mine.\n&7Bazaar and auction claims are at their respective NPCs in the hub.\n&7Full inventory? Make room and try again.\n&7If delivery is delayed, wait for saving to recover.","profiles-coop":"Each profile has its own world, wallet, core and inventories. \nSkills are personal within that profile. /ob coop invite \n<player> invites a friend; /ob coop accept accepts. Leaving \nand rejoining does not create another starter kit. Read \nremoval confirmations carefully.","survival":"Keep saplings and seeds, grow trees and crops, and use the \nconfigured renewable water, lava and farm recipes. Check \nNature packs and your pending claims. Do not delete the \nprofile to fix a missing item.","hub":"&6A village above the clouds\n&f/hub — merchants and the mine guide.\n&7The merchant buys ordinary resources. Bazaar has player orders; the auction has individual listings.\n&fMine: guide → Abandoned Mine → preparation.\n&7Everyone must be ready near the entrance with an active profile.\n&f/home — back to your island.","hub-generation":"Hub paths lead to the merchant, Bazaar, auction, workshop and guides. Click the Dungeon Guide NPC and select an available adventure. Old gate signs are decorative. /menu opens all sections; /home returns to your island.","hub-workshop":"The hub workshop is a meeting and help area.\nUse the workshop menu in your menu star for current\nrecipes and requirements.\nDecorative tables grant no tools or rewards.","combat-skills":"Equipment defines your combat style: melee, ranged or magic. Switch freely. PvE bonuses require no permanent class choice. Right-click a wand to cast. Mana regenerates with time and resets on restart. Normal target armor still applies.","combat-workshop":"Combat equipment: /combat from an open menu. Nine weapons and components remain craftable. New armor from all three sets comes only from combat-room chests. Existing gear is preserved. The Dungeon Guide in the hub opens endless arenas for 1–4 players.","combat-claims":"Rewards lists ordinary claims and chest offers separately. Each chest: preview exact loot and price → confirm → pay. Unpaid paid offers last 48 hours; purchased contents do not expire. Collect all takes ordinary rewards as space allows and never opens even free chests. Select your armor set here for the guarantee.","mine-hub":"In the hub click the Dungeon Guide NPC → choose {mine_name} → prepare your party. /dungeon invite <name>, accept <leader>, ready; leader: start. All 1–4 members need active gameplay profiles and must stand near the configured entry. Depths and diamond gear are recommendations. Disabled entries show their status.","mine-survival":"Arenas: four combat waves, then a boss on wave 5. Waves 6–10 follow, with no final wave. After a boss use /dungeon continue or finish. {mine_attempts} shared attempts. /hub or /home counts as a death; reconnect within {mine_reconnect}s. Dead players spectate until the wave ends. Restart aborts the run.","mine-claims":"Rewards and chest offers are created through reward-wave-limit inclusive; later waves only improve records. Each chest: exact preview → confirm → pay; unpaid paid offers last 48 hours. Collect all takes owned claims and never opens chests. Random duplicates do not reset the guarantee; it chooses a part not yet purchased."},"back":"Back","close":"Close","previous":"Previous page","next":"Next page","link":"Open section / location","choose":"Click to read.","state":"Current state","readonly":"&eHelp is available. Actions are temporarily unavailable.","no_profile":"Create a profile in Profiles.","unknown":"Unknown topic.","intro":"&6Welcome to OneBlock! &fClick the star → Profiles to create an island. &7Help: /ob guide","coins":"Coins: {value}","charge":"Charge: {value}","coin_label":"coins","break_label":"breaks","log_label":"logs","level_label":"level","location":"Visit the hub: {value}"}


