# Данж створює тільки власні тимчасові світи. enabled та allow-instance-worlds — явний дозвіл на запуск.
# Баланс, нагороди й координати entry збережено. NPC не активує вимкнений данж.
# NPC is never spawned by startup or the hub generator. Enable it to bind this configured FancyNpcs role name,
# then stand at the intended position/facing in the configured hub and run /obadmin market npc dungeon.
# Move an existing NPC explicitly with FancyNpcs /npc move_here <name>; OneBlock refuses to duplicate or move it.
# npc.type: VILLAGER / WANDERING_TRADER / PLAYER; skin — used only for PLAYER and resolved on explicit creation.
# Legacy npc.world/x/y/z/yaw/pitch values are ignored; FancyNpcs stores the manually chosen position.
# endless — новий маршрут. max-seconds/puzzle/rewards.secret збережені для старих журналів; secret bundle є нагородою звичайної хвилі.
# Нескінченні сесії не мають max-seconds. order циклічний; повторіть ID для повторення кімнати.
